# Guarantee Section
guarantee.title=Confianza en la Implementación
guarantee.subtitle=Optimizamos para implementación correcta. Estos términos reflejan confianza en ingeniería, no tácticas de marketing.
guarantee.nomaintenance.title=Para Implementación Inicial
guarantee.nomaintenance.desc=Si el sistema entregado no cumple las especificaciones acordadas, no pagas nada. Priorizamos implementación correcta sobre despliegue rápido.
guarantee.withmaintenance.title=Para Servicios Continuos
guarantee.withmaintenance.desc=Evalúa el sistema completo durante 30 días. Si no cumple las expectativas operacionales, cancela sin costo. Sin preguntas.
guarantee.trust=Estos términos existen porque construimos sistemas diseñados para funcionar correctamente, no para impresionar durante demostraciones.
guarantee.goal=La estabilidad operacional a largo plazo importa más que la impresionabilidad inicial. Los sistemas confiables construyen confianza con el tiempo.

