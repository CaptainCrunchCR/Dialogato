# How It Works Section
howitworks.badge=Descripción del Proceso
howitworks.title=Cómo Funciona
howitworks.subtitle=Esta página explica cómo opera Dialogato antes de que ocurra cualquier interacción humana. El objetivo es alinear expectativas.
howitworks.intro.line1=Dialogato no es un producto instantáneo. No es un generador de chatbots. No es un servicio de entrega con un clic.
howitworks.intro.line2=Este es un proceso estructurado y profesional. Trabajas directamente con un ingeniero que diseña, implementa y mantiene tu sistema conversacional. El proceso es intencionalmente transparente para que sepas exactamente qué esperar en cada paso.
howitworks.whatHappens=Qué Sucede
howitworks.businessExpects=Qué Proporcionas
howitworks.dialogatoDoes=Qué Hace Dialogato

# Phase 1
howitworks.phase1.title=Primer Contacto a Través del Sistema de Dialogato
howitworks.phase1.desc=La primera interacción es una conversación con nuestro propio sistema. Esto demuestra cómo trabajamos. No se requiere pago.
howitworks.phase1.whatHappens=Conversación natural que demuestra nuestro enfoque. Orientación clara, progresión estructurada, sin fricción.
howitworks.phase1.businessExpects=No se necesita preparación. Recopilamos información esencial para comprender tu intención.
howitworks.phase1.dialogatoDoes=Guía la conversación, hace preguntas relevantes, determina si existe alineación.

# Phase 2
howitworks.phase2.title=Validación de Interés y Calificación
howitworks.phase2.desc=El sistema evalúa el ajuste basándose en seriedad, claridad de necesidad y disposición para participar. No se requiere pago.
howitworks.phase2.whatHappens=Si hay alineación, proponemos una conversación con el ingeniero. Si no, el proceso termina respetuosamente.
howitworks.phase2.businessExpects=Comunicación honesta sobre necesidades y expectativas. Sin presión de ventas.
howitworks.phase2.dialogatoDoes=Evalúa el ajuste operacional, no solo el presupuesto. Propone pasos solo cuando hay alineación.

# Phase 3
howitworks.phase3.title=Primera Reunión con el Ingeniero
howitworks.phase3.desc=Primera interacción humana. Una conversación técnica y operacional, no una llamada de ventas. No se requiere pago.
howitworks.phase3.whatHappens=Conversación estructurada sobre tu realidad empresarial: comportamiento del cliente, cuellos de botella, restricciones, expectativas.
howitworks.phase3.businessExpects=Explicar cómo funcionan las cosas hoy. Proporcionar contexto operacional.
howitworks.phase3.dialogatoDoes=Escucha, hace preguntas aclaratorias, evalúa si podemos abordar tus necesidades.

# Phase 4
howitworks.phase4.title=Descubrimiento y Definición del Sistema
howitworks.phase4.desc=Fase de descubrimiento con múltiples interacciones. Sin duración fija. No se requiere pago aún.
howitworks.phase4.whatHappens=Análisis de patrones, definición de límites, identificación de qué automatizar y qué mantener humano.
howitworks.phase4.businessExpects=Proporcionar claridad, ejemplos y retroalimentación cuando se solicite.
howitworks.phase4.dialogatoDoes=Traduce tu negocio en diseño de sistema. Define comportamiento en escenarios reales.

# Phase 5
howitworks.phase5.title=Propuesta y Alineación
howitworks.phase5.payment=Primer Pago (50%)
howitworks.phase5.desc=Propuesta clara describiendo qué construiremos, cómo se comportará y extensiones opcionales. Una vez aprobada, el pago ocurre aquí.
howitworks.phase5.whatHappens=Propuesta escrita enfocada en resultados, no en jerga. Alcance claro y estructura de pago. 50% por adelantado tras aprobación.
howitworks.phase5.businessExpects=Revisar, hacer preguntas, solicitar ajustes. Aprobar y pagar 50% para comenzar.
howitworks.phase5.dialogatoDoes=Documenta diseño, aclara ambigüedades, asegura alineación.

# Phase 6
howitworks.phase6.title=Implementación y Pruebas Controladas
howitworks.phase6.desc=Implementación según diseño acordado. Pruebas, refinamiento, asegurando consistencia. El trabajo comienza tras el primer pago.
howitworks.phase6.whatHappens=Sistema construido, probado, refinado hasta cumplir estándares de calidad.
howitworks.phase6.businessExpects=Puede probar y dar retroalimentación. Responder a solicitudes de aclaración.
howitworks.phase6.dialogatoDoes=Implementa, prueba casos extremos, refina lógica, asegura comportamiento especificado.

# Phase 7
howitworks.phase7.title=Lanzamiento y Estabilización
howitworks.phase7.payment=Pago Final (50%)
howitworks.phase7.desc=Sistema monitoreado para comportamiento real. Pequeños ajustes esperados. 50% restante debido tras aceptación.
howitworks.phase7.whatHappens=Sistema en marcha. Interacciones reales observadas. Ajustes realizados. 50% final procesado tras confirmar que cumple especificaciones.
howitworks.phase7.businessExpects=Monitorear rendimiento, reportar problemas, confirmar aceptación, proporcionar pago final.
howitworks.phase7.dialogatoDoes=Monitorea rendimiento, ajusta según necesidad, asegura estabilidad tras aceptación.

# Phase 8
howitworks.phase8.title=Relación Continua y Evolución
howitworks.phase8.desc=Colaboración continua mantiene el sistema evolucionando con tu negocio. Mantenimiento mensual opcional, cobrado por adelantado.
howitworks.phase8.whatHappens=Cambios manejados incrementalmente sin interrumpir lo que funciona. Tarifa mensual cobrada al inicio del mes.
howitworks.phase8.businessExpects=Comunicar cambios, participar en revisiones, pagar tarifa mensual por adelantado si suscrito.
howitworks.phase8.dialogatoDoes=Mantiene confiabilidad, implementa cambios, asegura alineación continua.

# Final Clarification
howitworks.clarification.title=Aclaración Final
howitworks.clarification.content=Dialogato está construido y supervisado por un ingeniero de software profesional que usa IA como herramienta, no como atajo. El proceso es intencionalmente transparente para que los negocios sepan exactamente qué esperar en cada paso. Esta página debe dejarte con una comprensión clara de cómo funciona la relación, qué esfuerzo se requiere y por qué los resultados son confiables.

