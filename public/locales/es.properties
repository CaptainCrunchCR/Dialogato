# Features Section (Qué Resolvemos)
features.title=Qué Resolvemos
features.subtitle=No vendemos solo un bot: ofrecemos una solución completa diseñada para resolver los problemas repetitivos que enfrentan los negocios pequeños y medianos.
features.leads.title=Clientes Realmente Interesados
features.leads.desc=Dialogato identifica leads de calidad y asegura que tu negocio se enfoque solo en quienes realmente quieren tus servicios, sin dejar de ofrecer información completa a todos los interesados.
features.conversation.title=Conversación Fluida y Natural
features.conversation.desc=Dialogato conversa de manera natural, entendiendo preguntas escritas a mano y respondiendo de forma clara y personalizada. La experiencia es tan fluida que el cliente siente que habla con una persona real, pero todo está automatizado y controlado por ti.
features.scheduling.title=Programación Inteligente
features.scheduling.desc=El bot agenda citas, envía confirmaciones por correo o calendario y registra datos de clientes automáticamente. Tú no tienes que preocuparte por agendas manuales ni seguimientos: el sistema se adapta a tu flujo de trabajo y preferencias.
features.custom.title=Diseño a Medida para Tu Negocio
features.custom.desc=Desde el primer día, adaptamos Dialogato a las necesidades y particularidades de tu negocio. Nos comunicamos contigo para entender tus requerimientos y crear una solución única y efectiva.
features.payment.title=Gestión de Pagos
features.payment.desc=Dialogato puede automatizar cobros, procesar pagos recurrentes y enviar confirmaciones automáticamente, evitando esperas y errores manuales.
features.multilingual.title=Internacionalización Multilenguaje
features.multilingual.desc=Dialogato se adapta automáticamente al idioma de cada cliente. El cliente escribe naturalmente en su idioma, y el negocio recibe los mensajes en su idioma preferido. Incluso en interacciones que requieren atención humana, la comunicación fluye sin barreras lingüísticas.

# Platforms Section
platforms.title=Trabaja Donde Están Tus Clientes
platforms.subtitle=Un sistema que se conecta a WhatsApp y otras plataformas principales de mensajería. Expande tu alcance a medida que tu negocio crece.
platforms.whatsapp.name=WhatsApp
platforms.whatsapp.desc=Conéctate con clientes en la aplicación de mensajería más popular del mundo
platforms.telegram.name=Telegram
platforms.telegram.desc=Alcanza usuarios expertos en tecnología con mensajería rápida y segura
platforms.messenger.name=Messenger
platforms.messenger.desc=Interactúa con usuarios de Facebook directamente a través de Messenger
platforms.sms.name=SMS
platforms.sms.desc=Mensajería de texto tradicional para alcance universal
platforms.additional=+ Integración fácil con más plataformas a medida que surjan

# Benefits Section
benefits.title=Transforma Cómo Interactúas con Tus Clientes
benefits.subtitle=Diseñado para pequeñas y medianas empresas como la tuya. Menos tiempo perdido, más ventas y una experiencia profesional que deja huella desde el primer contacto.
benefits.time.title=Ahorra el 85% de Tu Tiempo
benefits.time.desc=Automatiza conversaciones repetitivas y enfócate en lo que más importa: hacer crecer tu negocio.
benefits.time.stat=Más de 40 horas ahorradas por mes
benefits.conversion.title=Solo Leads de Calidad
benefits.conversion.desc=Nunca pierdas tiempo con leads no calificados. Dialogato filtra e identifica clientes que realmente quieren tus servicios.
benefits.conversion.stat=100% leads calificados
benefits.customers.title=Experiencia Natural del Cliente
benefits.customers.desc=Tus clientes sienten que están hablando con una persona real que entiende sus necesidades, construyendo confianza desde el primer mensaje.
benefits.customers.stat=95% de satisfacción
benefits.scale.title=Evoluciona con Tu Negocio
benefits.scale.desc=Con un mantenimiento mensual mínimo, implementa actualizaciones, nuevas funciones o ajustes estacionales. Tu sistema crece contigo.
benefits.scale.stat=Escalabilidad ilimitada

