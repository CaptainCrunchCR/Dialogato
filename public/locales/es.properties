# Features Section (Qué Resolvemos)
features.title=Qué Resolvemos
features.subtitle=Diseñamos sistemas conversacionales que internalizan las reglas, tono y límites de tu negocio. El resultado son menos interrupciones, consultas mejor calificadas y comunicación confiable sin involucramiento manual constante.
features.leads.title=Los Clientes Serios Avanzan Naturalmente
features.leads.desc=La calificación emerge del impulso conversacional, no de preguntas de selección. Los clientes serios proceden sin fricción. Los navegantes casuales se autofiltran naturalmente. Recibes consultas que merecen tu atención.
features.conversation.title=Conversación Consciente del Dominio, No Respuestas Genéricas
features.conversation.desc=El sistema comprende las restricciones de tu negocio y las aplica consistentemente. Los clientes reciben respuestas relevantes sin navegar menús. La escalación hacia ti ocurre intencionalmente, no como respaldo por comprensión débil.
features.scheduling.title=Gestión de Citas
features.scheduling.desc=Las citas se programan dentro de tu disponibilidad real. Las confirmaciones se envían confiablemente. La información del cliente se registra correctamente. El sistema se adapta a tu flujo de trabajo sin requerir gestión manual del calendario.
features.custom.title=Diseñado para Tu Contexto Empresarial
features.custom.desc=Analizamos tus restricciones operacionales, consultas típicas y requisitos de comunicación. El sistema se construye para reflejar cómo opera realmente tu negocio. Recibes una solución funcional, no una interfaz de configuración.
features.payment.title=Procesamiento de Pagos
features.payment.desc=Los enlaces de pago se generan cuando es apropiado. Los cargos recurrentes se procesan confiablemente. Las confirmaciones se envían sin intervención manual. Reduce demoras y elimina errores comunes.
features.multilingual.title=Detección y Adaptación de Idioma
features.multilingual.desc=El idioma se detecta orgánicamente sin romper el flujo conversacional. Los clientes se comunican en su idioma preferido. Tú recibes mensajes en el tuyo. El contexto e intención se preservan a través de fronteras lingüísticas.

