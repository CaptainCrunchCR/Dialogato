# Guarantee Section
guarantee.title=Prueba Sin Riesgo - Nuestra Promesa
guarantee.subtitle=Creemos tan firmemente en trabajo excepcional con servicio sobresaliente que ofrecemos una prueba completamente sin riesgo para todos los nuevos clientes.
guarantee.nomaintenance.title=Promesa Simple
guarantee.nomaintenance.desc=Si no estás satisfecho con el resultado, solo avísanos. No pagas nada. Queremos que veas resultados reales antes de cualquier compromiso financiero.
guarantee.withmaintenance.title=Prueba de 30 Días Sin Riesgo
guarantee.withmaintenance.desc=Prueba el sistema completo con todas las funciones por 30 días. ¿No satisfecho por alguna razón? Cancela sin costo, sin preguntas. Así de simple.
guarantee.trust=Tu satisfacción es nuestra máxima prioridad. Trabajamos diligentemente para lograrlo, no solo lo prometemos.
guarantee.goal=Nuestro objetivo es construir relaciones a largo plazo basadas en resultados visibles, confianza y servicio excepcional que habla por sí mismo.

