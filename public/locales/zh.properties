# Features Section (我们解决的问题)
features.title=我们解决的问题
features.subtitle=我们不只是销售机器人：我们提供完整的解决方案，旨在解决中小型企业面临的重复性问题。
features.leads.title=真正感兴趣的客户
features.leads.desc=Dialogato识别优质潜在客户，确保您的企业只专注于真正想要您服务的客户，同时仍向所有感兴趣的各方提供完整信息。
features.conversation.title=自然流畅的对话
features.conversation.desc=Dialogato以自然的方式进行对话，理解手写问题并提供清晰、个性化的答案。体验如此流畅，客户感觉像是在与真人交谈，但一切都是自动化的，由您控制。
features.scheduling.title=智能排程
features.scheduling.desc=机器人可以安排预约、通过电子邮件或日历发送确认，并自动记录客户数据。您无需管理日历或跟进：系统会适应您的工作流程和偏好。
features.custom.title=为您的企业定制设计
features.custom.desc=从第一天起，我们就根据您企业的特定需求定制Dialogato。我们与您沟通以了解您的要求，并提供独特、有效的解决方案。
features.payment.title=支付处理
features.payment.desc=Dialogato可以自动化支付、处理定期收费并自动发送确认，消除延迟和人为错误。
features.multilingual.title=多语言支持
features.multilingual.desc=Dialogato自动适应每个客户的语言。客户用他们的语言自然书写，您的企业以其首选语言接收消息。即使在需要人工协助的互动中，沟通也能无缝进行。

