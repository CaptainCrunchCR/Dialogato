# Features Section (What We Solve)
features.title=What We Solve
features.subtitle=We don't just sell bots, we solve fundamental problems. Our AI-powered intelligent agents eliminate the daily grind of answering countless inquiries from customers who aren't ready to buy.
features.leads.title=Connect With Your Strongest Leads
features.leads.desc=Stop wasting time on customers who just want information. Our intelligent system enriches every conversation while automatically identifying and prioritizing genuine buyers who are ready to do business with you.
features.conversation.title=Natural AI Conversations, Not Bot Menus
features.conversation.desc=Forget repetitive bot menus. Our AI agents conduct completely fluid conversations. Customers write naturally as if talking to a real person. The system understands context, answers questions intelligently, and adapts to your business needs. Led by you.
features.scheduling.title=Smart Scheduling
features.scheduling.desc=The bot can schedule appointments, send confirmations via email or calendar, and record client data automatically. You don't need to manage calendars or follow-ups: the system adapts to your workflow and preferences.
features.custom.title=Custom Designed Through Close Collaboration
features.custom.desc=This is Dialogato's strongest point. From day one, we establish close communication to deeply understand your business environment and requirements. You get a completely unique, tailored solution, not a one-size-fits-all product.
features.payment.title=Payment Handling
features.payment.desc=Dialogato can automate payments, process recurring charges, and send confirmations automatically, eliminating delays and human errors.
features.multilingual.title=Multilingual Support
features.multilingual.desc=Dialogato automatically adapts to each client's language. Clients write naturally in their language, and your business receives messages in its preferred language. Even human-assisted interactions flow seamlessly.

