<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0f172a"/>
  
  <!-- Stylized 'D' for Dialogato -->
  <!-- Outer curve of D -->
  <path d="M 140 120 L 220 120 Q 372 120 372 256 Q 372 392 220 392 L 140 392 Z" 
        fill="url(#grad1)" 
        stroke="url(#grad2)" 
        stroke-width="8"/>
  
  <!-- Inner cutout to create the D shape -->
  <path d="M 200 180 L 220 180 Q 312 180 312 256 Q 312 332 220 332 L 200 332 Z" 
        fill="#0f172a"/>
  
  <!-- AI sparkle accent on the D -->
  <circle cx="340" cy="160" r="12" fill="#8b5cf6" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="160" r="6" fill="white" opacity="0.95"/>
  
  <!-- Small sparkle accent -->
  <circle cx="160" cy="140" r="8" fill="#6366f1" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="140" r="4" fill="white" opacity="0.9"/>
  
  <!-- Bottom right accent sparkle -->
  <circle cx="340" cy="352" r="10" fill="#3b82f6" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="352" r="5" fill="white" opacity="0.9"/>
</svg>
